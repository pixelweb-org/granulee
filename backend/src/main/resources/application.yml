spring:
  application:
    name: granulee
  web:
    resources:
      cache:
        # index.html and the favicon are always fetched afresh, so a new release shows up on the next load.
        # The files in the image all carry the same 1970 timestamp, which would otherwise let a browser
        # keep the old page for years, and would make every revalidation answer "not modified".
        cachecontrol:
          no-cache: true
        use-last-modified: false
server:
  port: 8080
granulee:
  # Users, sources, scan snapshots and trials are kept here, in granulee.db.
  data-dir: ${GRANULEE_DATA_DIR:./data}
  # Base64 of 32 random bytes. Empty: a key file is created inside the data dir.
  secret-key: ${GRANULEE_SECRET_KEY:}
  # A user name: that account gets a new one-time password at start, printed once. Remove it again afterwards.
  reset-admin: ${GRANULEE_RESET_ADMIN:}
logging:
  level:
    com.clickhouse: warn
