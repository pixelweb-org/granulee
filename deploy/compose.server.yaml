# Granulee on the server (Dockhand stack "service-granulee" on Prod/Powerhouse). The image comes from the
# registry; the release workflow pushes it for every vX.Y.Z tag. Updating: "Pull + recreate" in Dockhand.
# Sources, scans and trials live in the data directory, together with the key that encrypts source passwords.
services:
  granulee:
    image: ${REGISTRY:-192.168.3.88:18082}/granulee:${VERSION:-latest}
    container_name: granulee
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${HTTP_PORT:-18186}:8080"
    volumes:
      - ${DATA_PATH:-/mnt/disk2/containerdata/granulee}:/data
    environment:
      TZ: Europe/Berlin
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# A fixed subnet outside the LAN (192.168.0.0/19).
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-10.200.50.0/24}
