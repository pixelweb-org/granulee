# Granulee with Docker Compose. Builds the image from this repository.
#
#   docker compose -f deploy/compose.yaml up -d --build
#
# Granulee has no login of its own: the port below is bound to this machine only. Put a reverse proxy
# with authentication in front of it before you open it to anyone else. See docs/running.md.
services:
  granulee:
    build:
      context: ..
    image: granulee:latest
    container_name: granulee
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      # Sources, scans and trials, together with the key that encrypts stored ClickHouse passwords.
      - granulee-data:/data
    environment:
      TZ: ${TZ:-UTC}
      # Optional: base64 of 32 random bytes (openssl rand -base64 32). Unset, a key file is kept in /data.
      GRANULEE_SECRET_KEY: ${GRANULEE_SECRET_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  granulee-data:
